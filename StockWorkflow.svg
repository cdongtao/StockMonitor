<!-- Step 1: CLAUDE.md -->
<g onclick="sendPrompt('帮我写一个股票监控工具的CLAUDE.md文件，包含项目架构、技术栈、代码风格规范')" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
